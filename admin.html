<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Comunidad Mama Furiosa</title>
<meta name="theme-color" content="#6A2BC4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { background-image: none; }
  .bar { background: var(--purple); color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .bar h1 { margin: 0; font-size: 1.25rem; }
  .bar a, .bar button { color: #fff; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 16px; }
  .login { max-width: 380px; margin: 60px auto; background: #fff; border-radius: 22px; padding: 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
  .login h2 { margin: 0; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .tab { font: inherit; font-weight: 700; border: 2px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--purple); border-color: var(--purple); color: #fff; }
  .badge { display: inline-block; min-width: 22px; padding: 0 7px; border-radius: 999px; background: var(--red); color: #fff; font-size: .78rem; margin-left: 4px; }
  .tab[aria-selected="true"] .badge { background: #fff; color: var(--purple); }
  .item { background: #fff; border-radius: 18px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
  .item h3 { margin: 0; font-size: 1.05rem; }
  .meta { font-size: .85rem; color: var(--ink-soft); }
  .item p { margin: 0; white-space: pre-line; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions .btn { padding: 8px 14px; font-size: .9rem; }
  .btn-ok { background: #22C55E; color: #fff; box-shadow: 0 4px 0 #15803D; }
  .btn-no { background: #fff; color: var(--red); border: 2px solid #FBC9C5; }
  .pill { display: inline-block; font-size: .75rem; font-weight: 700; border-radius: 999px; padding: 2px 9px; margin-right: 4px; background: #F3EAFE; color: var(--purple-dark); }
  .pill.warn { background: #FFE4E1; color: #B42318; }
  .pill.ok { background: #DCFCE7; color: #166534; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .toolbar input[type=search] { flex: 1; min-width: 200px; font: inherit; border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row select, .row input { flex: 1; min-width: 0; }
  .catrow { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-bottom: 8px; }
  .catrow select, .catrow input { font: inherit; border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; min-width: 0; background: #fff; }
  .icon-btn { border: 0; background: var(--bg); border-radius: 10px; width: 38px; cursor: pointer; font-size: 1rem; }
  .empty-msg { text-align: center; color: var(--ink-soft); padding: 30px 10px; }
  label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: .9rem; color: var(--ink-soft); }
  @media (max-width: 560px) { .catrow { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="bar">
  <h1>💜 Admin · Comunidad Mama Furiosa</h1>
  <div class="row">
    <a href="/" target="_blank" rel="noopener">Ver sitio ↗</a>
    <button id="logout" class="btn btn-ghost small-btn" hidden style="color:var(--purple)">Salir</button>
  </div>
</header>

<div class="wrap">
  <form id="login" class="login">
    <h2>Ingresar</h2>
    <label class="field"><span>Clave de administración</span><input id="pass" type="password" autocomplete="current-password" required></label>
    <p id="login-msg" class="form-msg err"></p>
    <button class="btn btn-add" type="submit">Entrar</button>
  </form>

  <section id="panel" hidden>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="pendientes" aria-selected="true">Aportes por aprobar <span id="b-pend" class="badge"></span></button>
      <button class="tab" role="tab" data-tab="solicitudes" aria-selected="false">Solicitudes de cambio <span id="b-sol" class="badge"></span></button>
      <button class="tab" role="tab" data-tab="fichas" aria-selected="false">Todas las fichas</button>
    </div>

    <div id="tab-pendientes"></div>

    <div id="tab-solicitudes" hidden>
      <div class="toolbar"><label class="chk"><input type="checkbox" id="ver-cerradas"> Mostrar también las resueltas/descartadas</label></div>
      <div id="sol-list"></div>
    </div>

    <div id="tab-fichas" hidden>
      <div class="toolbar">
        <input id="fq" type="search" placeholder="Buscar por nombre, @usuario o texto…">
        <label class="chk"><input type="checkbox" id="solo-ocultas"> Solo ocultas</label>
      </div>
      <p id="fcount" class="meta"></p>
      <div id="fichas-list"></div>
    </div>
  </section>
</div>

<dialog id="edit-dialog">
  <form id="edit-form" method="dialog" novalidate>
    <div class="form-head">
      <h2 id="edit-title">Editar ficha</h2>
      <button type="button" class="close" data-close-edit aria-label="Cerrar">✕</button>
    </div>
    <label class="field"><span>Nombre (vacío = se muestra el @usuario)</span><input name="nombre" maxlength="80"></label>
    <div class="grid-2">
      <label class="field"><span>Instagram</span><input name="instagram" maxlength="40"></label>
      <label class="field"><span>Otras cuentas (separadas por coma)</span><input name="otrosInstagram" maxlength="200"></label>
    </div>
    <label class="field"><span>Descripción</span><textarea name="descripcion" rows="5" maxlength="1500"></textarea></label>
    <div class="grid-2">
      <label class="field"><span>WhatsApp</span><input name="whatsapp" maxlength="20"></label>
      <label class="field"><span>Web</span><input name="web" maxlength="200"></label>
    </div>
    <div class="grid-2">
      <label class="field"><span>Ubicación</span><input name="ubicacion" maxlength="80"></label>
      <label class="field"><span>Modalidad</span><input name="modalidad" maxlength="80"></label>
    </div>
    <div class="field">
      <span>Categorías</span>
      <div id="cat-rows"></div>
      <button type="button" class="btn btn-ghost small-btn" id="add-cat">＋ Agregar categoría</button>
    </div>
    <p id="edit-msg" class="form-msg err"></p>
    <div class="form-actions">
      <button type="button" class="btn btn-ghost" data-close-edit>Cancelar</button>
      <button type="submit" class="btn btn-add" id="edit-save">Guardar</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="datos.js"></script>
<script src="modelo.js"></script>
<script src="admin.js"></script>
</body>
</html>
